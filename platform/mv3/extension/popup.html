<!DOCTYPE html>
<html id="tblock-popup-panel" class="desktop">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark" />
<link rel="stylesheet" href="css/default.css">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/fa-icons.css">
<link rel="stylesheet" href="css/m3.css">
<link rel="stylesheet" href="css/filtering-mode.css">
<link rel="stylesheet" href="css/popup.css">
<title data-i18n="extName"></title>
</head>

<body class="loading busy">

<header class="md-appbar">
    <div class="md-brand">
        <img class="md-brand-logo" src="img/tblock.svg" alt="">
        <span class="md-brand-name" data-i18n="extName"></span>
    </div>
    <div class="md-appbar-actions">
        <button id="gotoMatchedRules" class="md-icon-button tool" type="button"
            data-i18n-title="popupTipMatchedRules">
            <span class="fa-icon">list-alt</span>
        </button>
        <button id="gotoDashboard" class="md-icon-button tool enabled" type="button"
            data-i18n-title="popupTipDashboard">
            <span class="fa-icon">cogs</span>
        </button>
    </div>
</header>

<main>
    <section class="md-hero needData">
        <div class="md-hero-shield-wrapper" id="heroShield" role="button" tabindex="0" title="Click to toggle protection on this site">
            <svg class="md-shield-svg" viewBox="0 0 24 24">
                <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="none" stroke="currentColor" stroke-width="2"/>
                <path class="md-shield-fill" d="M12 4.18l6 2.25v4.66c0 4.1-2.73 7.93-6 8.91-3.27-.98-6-4.81-6-8.91V6.43l6-2.25z" fill="currentColor"/>
                <path class="md-shield-icon-check" d="M10 15.2l-3.2-3.2 1.4-1.4 1.8 1.8 4.8-4.8 1.4 1.4z" fill="var(--md-surface)"/>
            </svg>
            <span id="heroBadge" class="md-hero-badge"></span>
        </div>
        <div id="hostname"><span></span></div>
        <div id="filteringModeText" class="md-mode">
            <span class="md-mode-name"></span><span class="md-mode-preview"></span>
        </div>
        <div id="heroStats" class="md-hero-stats">Protection Active</div>
        <div id="pauseControl" class="md-pause-control needData">
            <button id="pauseButton" class="md-pause-btn" type="button" title="Temporarily pause protection on this site">
                <svg class="md-pause-icon" viewBox="0 0 24 24" width="14" height="14">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="currentColor"/>
                </svg>
                <span id="pauseBtnText">Pause</span>
            </button>
            <div id="pauseMenu" class="md-pause-menu hidden">
                <button class="md-pause-option" data-duration="30000" type="button">Pause for 30s</button>
                <button class="md-pause-option" data-duration="300000" type="button">Pause for 5m</button>
            </div>
        </div>
    </section>

    <div class="filteringModeSlider needData" role="radiogroup" aria-label="popupFilteringModeLabel">
        <div class="filteringModeButton"><div></div></div>
        <span data-level="0" aria-label="filteringMode0Name"></span>
        <span data-level="1" aria-label="filteringMode1Name"></span>
        <span data-level="2" aria-label="filteringMode2Name"></span>
        <span data-level="3" aria-label="filteringMode3Name"></span>
    </div>

    <p id="filteringModeDescription" class="md-mode-description needData"></p>

    <div class="toolMenu localTools needHTTP">
        <h4 data-i18n="popupLocalToolsLabel"></h4>
        <button id="gotoZapper" class="tool md-tool enabled" type="button">
            <span class="fa-icon">bolt</span>
            <span class="md-tool-label" data-i18n="zapperTipEnter">_</span>
        </button>
        <button id="gotoPicker" class="tool md-tool enabled" type="button">
            <span class="fa-icon">eye-slash</span>
            <span class="md-tool-label" data-i18n="pickerTipEnter">_</span>
        </button>
        <button id="gotoUnpicker" class="tool md-tool" type="button">
            <span class="fa-icon">eye-open</span>
            <span class="md-tool-label" data-i18n="unpickerTipEnter">_</span>
        </button>
        <button id="gotoReport" class="tool md-tool enabled" type="button">
            <span class="fa-icon">comment-alt</span>
            <span class="md-tool-label" data-i18n="popupTipReport">_</span>
        </button>
    </div>
</main>

<aside>
    <span class="fa-icon">spinner</span>
</aside>

<script src="js/theme.js" type="module"></script>
<script src="js/fa-icons.js" type="module"></script>
<script src="js/i18n.js" type="module"></script>
<script src="js/popup.js" type="module"></script>

</body>

</html>
