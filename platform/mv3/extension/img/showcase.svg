<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c13"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2333"/>
      <stop offset="100%" stop-color="#181b28"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="oledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
    .title-l { font-weight: 700; font-size: 20px; fill: #f3f4f6; }
    .title-m { font-weight: 600; font-size: 15px; fill: #e5e7eb; }
    .body-s { font-weight: 400; font-size: 12px; fill: #9ca3af; }
    .label-xs { font-weight: 600; font-size: 10px; fill: #d1d5db; letter-spacing: 0.5px; }
    .badge-txt { font-weight: 700; font-size: 11px; fill: #ffffff; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect width="958" height="498" x="1" y="1" rx="15" fill="none" stroke="#2a3045" stroke-width="1.5"/>

  <!-- Subtle glow accents -->
  <circle cx="200" cy="120" r="140" fill="#7c3aed" opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="750" cy="380" r="160" fill="#0284c7" opacity="0.10" filter="url(#glowEffect)"/>

  <!-- ===================================================================== -->
  <!-- LEFT PANEL: T-BLOCK ORIGIN POPUP UI MOCKUP                            -->
  <!-- ===================================================================== -->
  <g transform="translate(48, 38)" filter="url(#cardShadow)">
    <!-- Popup Card Frame -->
    <rect width="320" height="424" rx="20" fill="url(#cardGrad)" stroke="#2e354b" stroke-width="1.5"/>

    <!-- Appbar -->
    <rect width="320" height="52" rx="20" fill="#1b1e2c"/>
    <rect width="320" height="2" y="50" fill="#262b3d"/>

    <!-- Logo icon & title -->
    <g transform="translate(18, 14)">
      <!-- Shield Logo -->
      <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3z" fill="url(#purpleGlow)"/>
      <path d="M10 13.8l-2.6-2.6 1.1-1.1 1.5 1.5 3.9-3.9 1.1 1.1z" fill="#ffffff"/>
      <text x="32" y="17" class="font-sans title-m">T-Block Origin</text>
    </g>

    <!-- Top action buttons -->
    <circle cx="265" cy="26" r="14" fill="#252a3b"/>
    <path d="M260 26h10 M265 21v10" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="295" cy="26" r="14" fill="#252a3b"/>
    <circle cx="295" cy="26" r="3" fill="#9ca3af"/>

    <!-- Hero Protection Hub -->
    <g transform="translate(160, 105)">
      <!-- Interactive Hero Shield with One-Click Power Switch -->
      <circle cx="0" cy="0" r="28" fill="#261c3d" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M0 -15 L-11 -10 v7.5 c0 6.5 4.5 12.5 11 14.5 c6.5 -2 11 -8 11 -14.5 V -10 Z" fill="url(#purpleGlow)"/>
      <path d="M-3.5 0.5 l2.5 2.5 l5.5 -5.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Blocked Badge Counter -->
      <g transform="translate(14, -20)">
        <rect width="24" height="18" rx="9" fill="#ef4444"/>
        <text x="12" y="13" text-anchor="middle" class="font-sans badge-txt">18</text>
      </g>
    </g>

    <!-- Hostname -->
    <text x="160" y="160" text-anchor="middle" class="font-sans title-l" font-size="17">example.com</text>

    <!-- Protection Mode Pill -->
    <g transform="translate(160, 184)">
      <rect x="-62" y="-11" width="124" height="22" rx="11" fill="#252238" stroke="#7c3aed" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans label-xs" fill="#c4b5fd">OPTIMAL PROTECTION</text>
    </g>

    <!-- Stats -->
    <text x="160" y="216" text-anchor="middle" class="font-sans body-s" fill="#a78bfa">18 requests blocked on this page</text>

    <!-- Pause Protection Snooze Button -->
    <g transform="translate(160, 240)">
      <rect x="-48" y="-11" width="96" height="22" rx="11" fill="#212638" stroke="#3b4259" stroke-width="1"/>
      <rect x="-38" y="-5" width="3" height="10" rx="1" fill="#9ca3af"/>
      <rect x="-31" y="-5" width="3" height="10" rx="1" fill="#9ca3af"/>
      <text x="2" y="3.5" class="font-sans label-xs" fill="#9ca3af">PAUSE 30s</text>
    </g>

    <!-- Stepped Slider -->
    <g transform="translate(40, 282)">
      <!-- Track -->
      <rect width="240" height="8" rx="4" fill="#282d40"/>
      <!-- Active Filled Track -->
      <rect width="160" height="8" rx="4" fill="url(#purpleGlow)"/>
      <!-- Stop Dots -->
      <circle cx="0" cy="4" r="3.5" fill="#e5e7eb"/>
      <circle cx="80" cy="4" r="3.5" fill="#e5e7eb"/>
      <circle cx="160" cy="4" r="3.5" fill="#ffffff"/>
      <circle cx="240" cy="4" r="3.5" fill="#6b7280"/>
      <!-- Slider Thumb on Level 2 (Optimal) -->
      <circle cx="160" cy="4" r="10" fill="#ffffff" filter="url(#glowEffect)"/>
      <circle cx="160" cy="4" r="6" fill="#8b5cf6"/>

      <!-- Labels -->
      <text x="0" y="24" text-anchor="middle" class="font-sans body-s" font-size="10">Off</text>
      <text x="80" y="24" text-anchor="middle" class="font-sans body-s" font-size="10">Basic</text>
      <text x="160" y="24" text-anchor="middle" class="font-sans label-xs" fill="#c4b5fd" font-size="10">Optimal</text>
      <text x="240" y="24" text-anchor="middle" class="font-sans body-s" font-size="10">Complete</text>
    </g>

    <!-- In-Page Tools Grid -->
    <g transform="translate(24, 346)">
      <!-- Zapper -->
      <rect x="0" y="0" width="62" height="48" rx="12" fill="#202536" stroke="#2e354b" stroke-width="1"/>
      <path d="M31 16 l-6 10 h5 l-2 8 l8 -11 h-5 z" fill="#facc15"/>
      <text x="31" y="42" text-anchor="middle" class="font-sans label-xs" font-size="8">ZAPPER</text>

      <!-- Picker -->
      <rect x="70" y="0" width="62" height="48" rx="12" fill="#202536" stroke="#2e354b" stroke-width="1"/>
      <circle cx="101" cy="22" r="7" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M106 27 l4 4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
      <text x="101" y="42" text-anchor="middle" class="font-sans label-xs" font-size="8">PICKER</text>

      <!-- Unpicker -->
      <rect x="140" y="0" width="62" height="48" rx="12" fill="#202536" stroke="#2e354b" stroke-width="1"/>
      <path d="M165 22 a6 6 0 0 1 12 0" fill="none" stroke="#a3e635" stroke-width="1.5"/>
      <circle cx="171" cy="22" r="2.5" fill="#a3e635"/>
      <text x="171" y="42" text-anchor="middle" class="font-sans label-xs" font-size="8">UNPICK</text>

      <!-- Dashboard -->
      <rect x="210" y="0" width="62" height="48" rx="12" fill="#202536" stroke="#2e354b" stroke-width="1"/>
      <circle cx="241" cy="21" r="5" fill="none" stroke="#f472b6" stroke-width="1.5"/>
      <path d="M241 13 v3 M241 26 v3 M233 21 h3 M246 21 h3" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round"/>
      <text x="241" y="42" text-anchor="middle" class="font-sans label-xs" font-size="8">SETTINGS</text>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- RIGHT PANEL: MATERIAL YOU THEMES & FEATURE SPOTLIGHT                  -->
  <!-- ===================================================================== -->
  <g transform="translate(416, 42)">
    <!-- Header -->
    <text x="0" y="24" class="font-sans title-l" font-size="24">Material Design 3 &amp; Dynamic Palettes</text>
    <text x="0" y="48" class="font-sans body-s" font-size="13">Tailored visual themes with tactile micro-interactions and true OLED dark mode.</text>

    <!-- Theme Cards Grid -->
    <g transform="translate(0, 72)">
      <!-- Baseline Purple Card -->
      <g transform="translate(0, 0)">
        <rect width="236" height="68" rx="14" fill="#1a1c2a" stroke="#3b3254" stroke-width="1.5"/>
        <rect width="36" height="36" x="16" y="16" rx="10" fill="url(#purpleGlow)"/>
        <text x="64" y="32" class="font-sans title-m" font-size="14">Baseline Purple</text>
        <text x="64" y="50" class="font-sans body-s" font-size="11">Classic Material Design 3</text>
      </g>

      <!-- Emerald Privacy Card -->
      <g transform="translate(254, 0)">
        <rect width="236" height="68" rx="14" fill="#1a2422" stroke="#1d483a" stroke-width="1.5"/>
        <rect width="36" height="36" x="16" y="16" rx="10" fill="url(#emeraldGrad)"/>
        <text x="64" y="32" class="font-sans title-m" font-size="14">Emerald Privacy</text>
        <text x="64" y="50" class="font-sans body-s" font-size="11">Clean, organic security tone</text>
      </g>

      <!-- Sapphire Ocean Card -->
      <g transform="translate(0, 82)">
        <rect width="236" height="68" rx="14" fill="#17222f" stroke="#1c3e5a" stroke-width="1.5"/>
        <rect width="36" height="36" x="16" y="16" rx="10" fill="url(#sapphireGrad)"/>
        <text x="64" y="32" class="font-sans title-m" font-size="14">Sapphire Ocean</text>
        <text x="64" y="50" class="font-sans body-s" font-size="11">High-focus deep marine</text>
      </g>

      <!-- Coral Energy Card -->
      <g transform="translate(254, 82)">
        <rect width="236" height="68" rx="14" fill="#271c1b" stroke="#5a2d21" stroke-width="1.5"/>
        <rect width="36" height="36" x="16" y="16" rx="10" fill="url(#coralGrad)"/>
        <text x="64" y="32" class="font-sans title-m" font-size="14">Coral Energy</text>
        <text x="64" y="50" class="font-sans body-s" font-size="11">Warm &amp; vibrant dynamic UI</text>
      </g>

      <!-- OLED Pure Black Card (Full Width) -->
      <g transform="translate(0, 164)">
        <rect width="490" height="74" rx="14" fill="url(#oledGrad)" stroke="#3f3f46" stroke-width="1.5"/>
        <rect width="42" height="42" x="16" y="16" rx="10" fill="#000000" stroke="#52525b" stroke-width="1.5"/>
        <path d="M37 28 a9 9 0 1 1 -9 -9 a7 7 0 0 0 9 9 z" fill="#f4f4f5"/>
        <text x="72" y="36" class="font-sans title-m" font-size="15">OLED Pure Black Mode</text>
        <text x="72" y="54" class="font-sans body-s" font-size="11" fill="#a1a1aa">Absolute #000000 backgrounds for infinite contrast &amp; maximum battery savings.</text>
      </g>
    </g>

    <!-- Key Tech Feature Badges -->
    <g transform="translate(0, 334)">
      <!-- Pill 1: 0ms DNR -->
      <g transform="translate(0, 0)">
        <rect width="154" height="42" rx="10" fill="#1b2030" stroke="#2d354d" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#10b981"/>
        <text x="34" y="19" class="font-sans label-xs" font-size="10" fill="#f3f4f6">0ms JS Latency</text>
        <text x="34" y="32" class="font-sans body-s" font-size="9" fill="#9ca3af">Native C++ DNR</text>
      </g>

      <!-- Pill 2: 1-Click Shield Power -->
      <g transform="translate(164, 0)">
        <rect width="158" height="42" rx="10" fill="#1b2030" stroke="#2d354d" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#8b5cf6"/>
        <text x="34" y="19" class="font-sans label-xs" font-size="10" fill="#f3f4f6">1-Click Shield Toggle</text>
        <text x="34" y="32" class="font-sans body-s" font-size="9" fill="#9ca3af">Instant Master Switch</text>
      </g>

      <!-- Pill 3: Snooze Pause Timer -->
      <g transform="translate(332, 0)">
        <rect width="158" height="42" rx="10" fill="#1b2030" stroke="#2d354d" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#f59e0b"/>
        <text x="34" y="19" class="font-sans label-xs" font-size="10" fill="#f3f4f6">Snooze Bypass Timer</text>
        <text x="34" y="32" class="font-sans body-s" font-size="9" fill="#9ca3af">30s / 5m Anti-Adblock</text>
      </g>
    </g>
  </g>
</svg>
